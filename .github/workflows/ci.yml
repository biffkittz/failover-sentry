# Checks every pull request and push to main: types, lint and tests of every package (the workflow tests against the
# Temporal CLI's dev server), the console's end-to-end tests, the Terraform checks and the container builds.
# Nothing here deploys; deployments go through Terraform (docs/DEPLOYMENT.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Types, lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The workflow tests run against the Temporal CLI's dev server; the SDK must never download one.
      - name: Install the Temporal CLI (pinned by checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/temporal.tgz" \
            https://github.com/temporalio/cli/releases/download/v1.10.0/temporal_cli_1.10.0_linux_amd64.tar.gz
          echo "521f461f3d108902763bb71e85cd0fd382dc9357b59604ae03da6ae734d16890  $RUNNER_TEMP/temporal.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/temporal.tgz" -C "$RUNNER_TEMP" temporal
          echo "TEMPORAL_CLI_PATH=$RUNNER_TEMP/temporal" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: Console end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:contracts
      - run: npx playwright install --with-deps chromium
        working-directory: apps/console/web
      - run: npm run test:e2e
        working-directory: apps/console/web
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/console/web/playwright-report
          retention-days: 7

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - run: tflint --init && tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

  images:
    name: Container images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dockerfile:
          [
            apps/worker/Dockerfile,
            apps/console/Dockerfile,
            apps/regional-app/Dockerfile,
            apps/edge-router/Dockerfile,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.dockerfile }}
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --file "$DOCKERFILE" --build-arg APP_VERSION="${GITHUB_SHA::7}" .
