# Git hooks (https://pre-commit.com). They call tools installed locally (terraform, tflint, terraform-docs, node), so
# there are no hook repositories to download or pin. Install once per clone:
#   pipx install pre-commit && pre-commit install
# Run every hook on demand with: pre-commit run --all-files
# The test suites aren't hooks (too slow for every commit): CI runs them on every pull request.
repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform -chdir=infra fmt -recursive
        language: system
        files: ^infra/.*\.(tf|tfvars|hcl)$
        pass_filenames: false

      - id: terraform-validate
        name: terraform validate
        entry: bash -c 'cd infra && terraform init -backend=false -input=false >/dev/null && terraform validate'
        language: system
        files: ^infra/.*\.(tf|hcl)$
        pass_filenames: false

      - id: tflint
        name: tflint
        entry: bash -c 'cd infra && tflint --init >/dev/null && tflint --recursive --format compact'
        language: system
        files: ^infra/.*\.(tf|hcl)$
        pass_filenames: false

      - id: terraform-docs
        name: terraform-docs (refreshes the README reference sections)
        entry: bash -c 'cd infra && terraform-docs . >/dev/null'
        language: system
        files: ^infra/(.*\.tf|.*README\.md|\.terraform-docs\.yml)$
        pass_filenames: false

      - id: eslint
        name: eslint (all packages)
        entry: npm run lint
        language: system
        files: \.(ts|js|vue)$
        pass_filenames: false

      - id: typecheck
        name: typecheck (all packages)
        entry: npm run typecheck
        language: system
        files: \.(ts|vue)$
        pass_filenames: false
